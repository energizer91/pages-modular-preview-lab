name: Publish Pages previews
on:
  workflow_run:
    workflows: [Build preview package]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: preview-context
          path: context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify build provenance and current PR head
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/verify-run.mjs
      - uses: actions/download-artifact@v4
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.maintenance != 'true' && steps.context.outputs.remove != 'true'
        with:
          name: preview-package
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Register preview deployment
        id: preview
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.maintenance != 'true' && steps.context.outputs.remove != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
        run: node tooling/scripts/deployment.mjs start
      - name: Update preview and storage report
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
          REMOVE: ${{ steps.context.outputs.remove }}
          MAINTENANCE: ${{ steps.context.outputs.maintenance }}
        run: |
          if [ "$MAINTENANCE" = true ]; then
            node tooling/scripts/reconcile.mjs site="$GITHUB_WORKSPACE/site" repository="$GITHUB_REPOSITORY"
          else
            node tooling/scripts/publish.mjs site="$GITHUB_WORKSPACE/site" package="$GITHUB_WORKSPACE/incoming" pr="$PR" sha="$SHA" remove="$REMOVE" repository="$GITHUB_REPOSITORY"
          fi
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish preview and reconcile storage"
            git push origin gh-pages
          fi
      - uses: actions/configure-pages@v5
        if: steps.context.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.context.outputs.skip != 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.context.outputs.skip != 'true'
        id: deployment
      - name: Verify served preview snapshots
        id: served
        if: steps.context.outputs.skip != 'true'
        env:
          SITE: ${{ github.workspace }}/site
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tooling/scripts/verify-served.mjs
      - name: Publish personal URL to Deployment and PR
        if: always() && steps.preview.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.preview.outputs.id }}
          PUBLISHED: ${{ steps.deployment.outcome == 'success' && steps.served.outcome == 'success' }}
          SITE: ${{ github.workspace }}/site
        run: node tooling/scripts/deployment.mjs finish
      - name: Retire closed PR deployment
        if: steps.context.outputs.remove == 'true' && steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
        run: node tooling/scripts/deployment.mjs retire
